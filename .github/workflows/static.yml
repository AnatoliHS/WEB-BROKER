name: Deploy 11ty site to Pages

on:
  push:
    branches: ["develop"] # Updated to watch the develop branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      - name: Build site
        # This matches the build command you use for your environments
        run: cd src && bun x @11ty/eleventy --output=../dist 
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This must match your 11ty output directory
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
