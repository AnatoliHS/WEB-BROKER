<style>

.scene {

  padding: 50px 40px;
  max-width: 550px;
  width: 100%;
  text-align: center;
  transform-origin: center center;
  animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.thanks-title {
  font-family: var(--font-serif, serif);
  font-size: 2.75rem;
  color: var(--primary-color, #1a365d);
  margin-bottom: 20px;
  font-weight: 300;
}

.thanks-message {

  margin-bottom: 35px;
  font-weight: 400;
}

.btn-container {

  justify-content: center;
}

.success-icon-container {

  justify-content: center;
  margin-bottom: 28px;
}

.success-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;

  stroke-width: 2.5;
  stroke: var(--accent-color, #b8860b);
  stroke-miterlimit: 10;
  box-shadow: inset 0px 0px 0px var(--accent-color);
  animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

.success-icon-circle {

  stroke: var(--accent-color, #b8860b);
  fill: none;
  animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
}

.success-icon-check {

  stroke-dasharray: 48;
  stroke-dashoffset: 48;
  animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
}

/* Keyframes */
@keyframes stroke {
  100% {
    stroke-dashoffset: 0;
  }
}

@keyframes scale {
  0%, 100% {
    transform: none;
  }
  50% {
    transform: scale3d(1.1, 1.1, 1);
  }
}

@keyframes fill {
  100% {
    box-shadow: inset 0px 0px 0px 40px rgba(184, 134, 11, 0.04);
  }
}

@keyframes slideInUp {
  0% {
    opacity: 0;
    transform: translateY(30px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 576px) {
